<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Verity Tamagotchi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #1f2937; border-radius: 18px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .stat-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .progress-bar-bg { flex: 1; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 50%; border-radius: 10px; transition: width 0.3s; }
    .pet-stage { display: flex; flex-direction: column; align-items: center; min-height: 220px; justify-content: center; position: relative; }
    .speech-bubble { background: #fff; color: #111; padding: 10px 14px; border-radius: 14px; font-weight: 600; font-size: 13px; text-align: center; margin-bottom: 16px; max-width: 90%; }
    .verity-avatar { font-size: 90px; line-height: 1; transition: transform 0.1s; }
    .verity-avatar:active { transform: scale(1.15); }
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { background: #374151; color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-feed { background: #ef4444; }
    .btn-games { background: #8b5cf6; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
    .modal-card { background: #1f2937; border-radius: 16px; padding: 16px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .odd-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 100%; }
    .odd-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; background: rgba(255,255,255,0.05); border-radius: 4px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="card">
    <div class="stat-row">
      <span>🍎 Голод</span>
      <div class="progress-bar-bg"><div id="hungerBar" class="progress-bar-fill" style="background:#ef4444; width:80%;"></div></div>
      <span id="hungerVal">80%</span>
    </div>
    <div class="stat-row">
      <span>❤️ Любовь</span>
      <div class="progress-bar-bg"><div id="loveBar" class="progress-bar-fill" style="background:#ec4899; width:50%;"></div></div>
      <span id="loveVal">50%</span>
    </div>
  </div>

  <div class="card pet-stage" onclick="petVerity()">
    <div id="speechBubble" class="speech-bubble">Привет! Нажми на меня, чтобы погладить! 💛</div>
    <div id="verityAvatar" class="verity-avatar">🟡🙂</div>
    <span style="font-size:11px; color:#9ca3af; margin-top:8px;">Жми прямо на Верити (+1% Любви)</span>
  </div>

  <div class="actions-grid">
    <button class="btn btn-feed" onclick="feedVerity()">🍎 Покормить</button>
    <button class="btn btn-games" onclick="openGames()">🎮 Мини-игры</button>
  </div>
</div>

<!-- GAMES MENU -->
<div id="gamesModal" class="modal-overlay">
  <div class="modal-card">
    <h3>🎮 Выбери мини-игру</h3>
    <button class="btn" onclick="startOddGame()">👿 Найди лишнего (10x10)</button>
    <button class="btn" onclick="startBoxesGame()">📦 3 Коробки</button>
    <button class="btn" onclick="closeModal('gamesModal')">Закрыть</button>
  </div>
</div>

<!-- ODD GAME MODAL -->
<div id="oddModal" class="modal-overlay">
  <div class="modal-card">
    <h4 id="oddTimer">⏱️ 12 сек</h4>
    <div id="oddGrid" class="odd-grid"></div>
  </div>
</div>

<script>
  let state = { hunger: 80, love: 50, lastPet: 0 };
  let gameTimer = null;

  function updateUI() {
    document.getElementById('hungerBar').style.width = state.hunger + '%';
    document.getElementById('hungerVal').innerText = state.hunger + '%';
    document.getElementById('loveBar').style.width = state.love + '%';
    document.getElementById('loveVal').innerText = state.love + '%';
  }

  function setPhrase(t) { document.getElementById('speechBubble').innerText = t; }

  function petVerity() {
    const now = Date.now();
    if (now - state.lastPet < 1000) return;
    state.lastPet = now;
    state.love = Math.min(100, state.love + 1);
    updateUI();
    setPhrase("Хи-хи, мне щекотно! ✨");
  }

  function feedVerity() {
    if (state.hunger >= 100) {
      state.love = Math.max(0, state.love - 5);
      updateUI();
      setPhrase("Я уже сыт! Мне плохо... (-5% любви) 🤢");
      return;
    }
    state.hunger = Math.min(100, state.hunger + 20);
    state.love = Math.min(100, state.love + 2);
    updateUI();
    setPhrase("😋 Ням-ням! Спасибо за заботу!");
  }

  function openGames() { document.getElementById('gamesModal').style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; clearInterval(gameTimer); }

  function startOddGame() {
    closeModal('gamesModal');
    document.getElementById('oddModal').style.display = 'flex';
    const grid = document.getElementById('oddGrid');
    grid.innerHTML = '';
    const target = Math.floor(Math.random() * 100);
    let left = 12;

    for(let i=0; i<100; i++) {
      const cell = document.createElement('div');
      cell.className = 'odd-cell';
      cell.innerText = i === target ? '👿' : '😈';
      cell.onclick = () => {
        closeModal('oddModal');
        if (i === target) {
          state.love = Math.min(100, state.love + 8);
          setPhrase("🎉 Ура! Ты нашел лишнего! (+8% любви)");
        } else {
          state.love = Math.max(0, state.love - 5);
          setPhrase("❌ Не угадал! (-5% любви)");
        }
        updateUI();
      };
      grid.appendChild(cell);
    }

    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
      left--;
      document.getElementById('oddTimer').innerText = `⏱️ ${left} сек`;
      if (left <= 0) {
        closeModal('oddModal');
        state.love = Math.max(0, state.love - 5);
        updateUI();
        setPhrase("⏰ Время вышло! (-5% любви)");
      }
    }, 1000);
  }

  function startBoxesGame() {
    closeModal('gamesModal');
    const win = Math.floor(Math.random() * 3) + 1;
    const choice = prompt("Выбери коробку (1, 2 или 3):");
    if (choice == win) {
      state.love = Math.min(100, state.love + 5);
      setPhrase("🎉 Угадал! (+5% любви)");
    } else {
      state.love = Math.max(0, state.love - 5);
      setPhrase("❌ Не угадал! (-5% любви)");
    }
    updateUI();
  }
</script>
</body>
</html>
